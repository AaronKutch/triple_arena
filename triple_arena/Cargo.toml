[package]
name = "triple_arena"
# change the dependency used by `triple_arena_render` when the minor version or higher is changed
version = "0.14.0"
edition = "2024"
# `flake.nix` and `ci.yml` read this automatically, but run `nix flake update`
# and fix any hashes. The pinned toolchain in `pinned-toolchain.toml` is
# bumped separately.
rust-version = "1.88"
authors = ["Aaron Kutch <aaronkutch@att.net>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/AaronKutch/triple_arena"
documentation = "https://docs.rs/triple_arena"
description = "Regular, Chain, Surjection, and Ordered Arenas supporting non-Clone types, deletion, and stack backing"
keywords = ["arena", "generation", "no_std"]
categories = ["memory-management", "data-structures", "no-std"]

# TODO in a future version put each of the arenas under feature flags enabled by default (for faster compilation in cases where certain types are not needed)

[features]
default = ["alloc"]
# When disabled, there is no longer a default backing generic parameter on the `Arena`s,
# so they must be explicitly specified
alloc = ["recasting/alloc"]
std = ["alloc", "recasting/std"]
serde_support = ["serde"]

# FIXME review and add MSRV <=1.70 to recasting crate, bump minor version
[dependencies]
#recasting = { path = "../../recasting", default-features = false }
recasting = { version = "0.2", default-features = false }
serde = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
ron = "0.12"
triple_arena_render = { path = "../triple_arena_render" }
